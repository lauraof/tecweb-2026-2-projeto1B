{% extends "notes/base.html" %}
{% load static %}

{% block content %}

<div class="pagina-por-tag">
    <div class="claseproh3">
        <h3 class="tag2">{{tag}}</h3>
    </div>
    <div class="card-container">
      {% for note in notes %}
      <div class="card">
        <div class="cabecalho">
            <h3 class="card-title">{{note.title}}</h3>
        </div>
        <div class="card-content">
            <p>{{note.content}}</p>
        </div>
      </div>
      {% endfor %}
    </div>
</div>

{% endblock %}
